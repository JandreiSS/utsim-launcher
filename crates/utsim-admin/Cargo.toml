[package]
name = "utsim-admin"
description = "Author's window over utsim-publicar: testers and access codes, publications, open access per channel, keys (never shipped to testers)"
version.workspace = true
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-admin"
path = "src/main.rs"

[lib]
name = "utsim_admin"
path = "src/lib.rs"

[dependencies]
utsim-publicar = { path = "../utsim-publicar" }
utsim-launcher-core = { path = "../utsim-launcher-core" }
# Same egui as the launcher, so Cargo.lock keeps one egui. Light: glow renderer only.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# The flat look of the launcher (system fonts, PNG icons).
utsim-ui-tema = { path = "../utsim-ui-tema", features = ["familia"] }

[dev-dependencies]
tempfile = "3"
utsim-ui-tema = { path = "../utsim-ui-tema", features = ["familia", "captura"] }
