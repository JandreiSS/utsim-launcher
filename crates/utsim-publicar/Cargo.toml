[package]
name = "utsim-publicar"
description = "Author's tool of the UTSim launcher: signing keys, tester codes, encrypted packages and the signed manifest (writes local files only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "utsim_publicar"
path = "src/lib.rs"

[[bin]]
name = "utsim-publicar"
path = "src/main.rs"

[dependencies]
utsim-launcher-core = { path = "../utsim-launcher-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
