[package]
name = "utsim-launcher"
description = "Launcher of the UTSim family: access code, products and channels, signed updates"
version.workspace = true
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-launcher"
path = "src/main.rs"

[lib]
name = "utsim_launcher"
path = "src/lib.rs"

[dependencies]
utsim-launcher-core = { path = "../utsim-launcher-core" }
# Same egui as the 3D viewer (bevy_egui 0.43), so Cargo.lock keeps one egui. Light: glow
# renderer only, no wgpu.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
