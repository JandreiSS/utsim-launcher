[package]
name = "utsim-launcher"
description = "Launcher of the UTSim family: access code, products and channels, signed updates"
# Its own version: the installed launcher updates itself when the manifest has a newer one
# (scripts/publicar-launcher.sh refuses to publish any other version).
version = "0.3.0"
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-launcher"
path = "src/main.rs"

[lib]
name = "utsim_launcher"
path = "src/lib.rs"

[dependencies]
utsim-launcher-core = { path = "../utsim-launcher-core" }
# Same egui as the 3D viewer (bevy_egui 0.43), so Cargo.lock keeps one egui. Light: glow
# renderer only, no wgpu.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# The flat look shared with the admin app (system fonts, PNG icons).
utsim-ui-tema = { path = "../utsim-ui-tema", features = ["familia"] }
# The texts in five languages (idiomas/*/lancador.ftl) and the language picker.
utsim-idiomas.workspace = true

[dev-dependencies]
tempfile = "3"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
# Headless pictures of the window in the tests.
utsim-ui-tema = { path = "../utsim-ui-tema", features = ["familia", "captura"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
